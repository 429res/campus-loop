server:
  port: ${SERVER_PORT:8088}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: campus-loop
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:campus_loop_dev}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:campus_loop}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    time-zone: UTC
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
campus:
  jwt-secret: ${JWT_SECRET}
  session-hours: 8
  registration-mode: ${CAMPUS_REGISTRATION_MODE:CLOSED}
  upload-dir: ${UPLOAD_DIR:../.local/uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175}
  bootstrap-enabled: ${CAMPUS_BOOTSTRAP_ENABLED:false}
  bootstrap-admin-username: ${CAMPUS_ADMIN_USERNAME:}
  bootstrap-admin-password: ${CAMPUS_ADMIN_PASSWORD:}
  bootstrap-user-username: ${CAMPUS_USER_USERNAME:}
  bootstrap-user-password: ${CAMPUS_USER_PASSWORD:}
  bootstrap-only: ${CAMPUS_BOOTSTRAP_ONLY:false}
  demo-enabled: ${CAMPUS_DEMO_ENABLED:true}

  rate-limit:
    enabled: ${CAMPUS_RATE_LIMIT_ENABLED:true}
    max-keys: ${CAMPUS_RATE_LIMIT_MAX_KEYS:10000}
    trusted-proxies: ${CAMPUS_RATE_LIMIT_TRUSTED_PROXIES:}
    login:
      limit: ${CAMPUS_RATE_LIMIT_LOGIN_LIMIT:10}
      window: ${CAMPUS_RATE_LIMIT_LOGIN_WINDOW:1m}
    registration:
      limit: ${CAMPUS_RATE_LIMIT_REGISTRATION_LIMIT:5}
      window: ${CAMPUS_RATE_LIMIT_REGISTRATION_WINDOW:10m}
    password:
      limit: ${CAMPUS_RATE_LIMIT_PASSWORD_LIMIT:5}
      window: ${CAMPUS_RATE_LIMIT_PASSWORD_WINDOW:10m}
    upload:
      limit: ${CAMPUS_RATE_LIMIT_UPLOAD_LIMIT:20}
      window: ${CAMPUS_RATE_LIMIT_UPLOAD_WINDOW:1m}

  exchange-expiry:
    enabled: ${CAMPUS_EXCHANGE_EXPIRY_ENABLED:true}
    batch-size: ${CAMPUS_EXCHANGE_EXPIRY_BATCH_SIZE:50}
    delay-ms: ${CAMPUS_EXCHANGE_EXPIRY_DELAY_MS:30000}
    initial-delay-ms: ${CAMPUS_EXCHANGE_EXPIRY_INITIAL_DELAY_MS:1000}

name: campus-loop
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_PORT:-3308}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campus_loop_dev}
      MYSQL_USER: ${DB_USERNAME:-campus_loop}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run node scripts/setup.mjs first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run node scripts/setup.mjs first}
    volumes:
      - campus_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
volumes:
  campus_mysql:

name: 问题报告
description: 提供可以复现的问题，不含敏感信息
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤、预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 分支/提交、系统、工具版本、H5或微信、屏幕大小。不要贴口令或token。
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据与影响范围
